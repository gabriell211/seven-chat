import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seven.chat'
    buildFeatures { buildConfig true }
    compileSdk 35

    defaultConfig {
        applicationId 'com.seven.chat'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0-alpha.1'
        // Public HTTPS URL only; credentials and database connection details never enter the APK.
        def suppliedApiUrl = providers.gradleProperty('sevenApiUrl').orElse('').get()
        if (suppliedApiUrl && !suppliedApiUrl.startsWith('https://')) {
            throw new GradleException('sevenApiUrl must be HTTPS')
        }
        buildConfigField 'String', 'API_BASE_URL', JsonOutput.toJson(suppliedApiUrl)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
