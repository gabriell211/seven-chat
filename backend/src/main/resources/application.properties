spring.application.name=seven-chat-api
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/seven_chat}
spring.datasource.username=${DB_USER:seven_chat}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=true
spring.main.banner-mode=off

# Explicitly configured real SMTP delivery only; never ship credentials in APKs.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
seven.mail.from=${SEVEN_MAIL_FROM:}
seven.mail.code-pepper=${SEVEN_EMAIL_CODE_PEPPER:}
