name: Seven Chat Migration Generator
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run db:generate -- --name live-interaction
      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet -- drizzle; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "gabriell211"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "db: generate live interaction migration"
          git fetch origin ${{ github.head_ref }}
          git rebase origin/${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle-generated
          path: drizzle
          if-no-files-found: error
