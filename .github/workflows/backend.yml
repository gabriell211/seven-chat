name: Seven Chat Java API

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seven_chat_ci
          POSTGRES_USER: seven_ci
          POSTGRES_PASSWORD: seven_ci_only
          POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seven_ci -d seven_chat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Auditar navegação Android e contratos
        run: python3 scripts/check_pages.py
      - name: Build and integration tests
        env:
          JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/seven_chat_ci
          DB_USER: seven_ci
          DB_PASSWORD: seven_ci_only
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Preserve test reports on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-api-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: error
