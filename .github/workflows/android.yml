name: Android Java
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Validate brand and adaptive icons
        run: python3 scripts/check_brand.py
      - name: Auditar todas as páginas
        run: python3 scripts/check_pages.py
      - name: Testar regras locais
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all testDebugUnitTest 2>&1 | tee /tmp/seven-gradle-test.log
          python3 scripts/check_ci_warnings.py /tmp/seven-gradle-test.log
      - name: Compilar APK de depuração
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all assembleDebug 2>&1 | tee /tmp/seven-gradle-build.log
          python3 scripts/check_ci_warnings.py /tmp/seven-gradle-build.log
      - uses: actions/upload-artifact@v6
        with:
          name: SevenChat-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
