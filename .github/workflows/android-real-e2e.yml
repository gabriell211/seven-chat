name: Seven Chat - Android E2E com API local

# Manual by design: never deploys and never uses production credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-chat-device-e2e
  cancel-in-progress: false

jobs:
  android-real-api:
    name: Emulador Android + Java 21 + PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seven_chat_ci
          POSTGRES_USER: seven_ci
          POSTGRES_PASSWORD: seven_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seven_ci -d seven_chat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify immutable app icons and declared endpoints
        run: |
          python3 scripts/check_brand.py
          python3 scripts/check_pages.py

      - name: Start local Java backend with real PostgreSQL
        env:
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/seven_chat_ci
          DB_USER: seven_ci
          DB_PASSWORD: seven_ci_only
        run: |
          set -euo pipefail
          nohup mvn -B -ntp -f backend/pom.xml \
            -Dspring-boot.run.profiles=test spring-boot:run \
            > /tmp/seven-api-local.log 2>&1 < /dev/null &
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "Local API + PostgreSQL healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Local API failed to become healthy"
          tail -n 100 /tmp/seven-api-local.log
          exit 1

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable hardware accelerated emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::warning::KVM unavailable; emulator may run slowly."
          fi

      - name: Real-device-equivalent emulator integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Preserve Android and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-chat-android-real-api-e2e
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            /tmp/seven-api-local.log
          if-no-files-found: warn

# This workflow is NOT an approval for all features, voice rooms, livestreams
# and VIP purchases. release-certification.json must remain fail-closed.
