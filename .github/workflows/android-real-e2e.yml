name: Seven Chat - Android E2E com API local

# Runs on the integration PR and on demand. No deployment or production credentials.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'backend/**'
      - 'scripts/check_ci_warnings.py'
      - '.github/workflows/android-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-real-api:
    name: Emulador Android + Java 21 + PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seven_chat_ci
          POSTGRES_USER: seven_ci
          POSTGRES_PASSWORD: seven_ci_only
          POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seven_ci -d seven_chat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify immutable app icons and declared endpoints
        run: |
          python3 scripts/check_brand.py
          python3 scripts/check_pages.py

      - name: Start local Java backend with real PostgreSQL
        env:
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/seven_chat_ci
          DB_USER: seven_ci
          DB_PASSWORD: seven_ci_only
        run: |
          set -euo pipefail
          # Do not keep Maven alive alongside Gradle, the JVM and Android emulator.
          mvn -B -ntp -f backend/pom.xml -DskipTests package \
            > /tmp/seven-api-package.log 2>&1
          python3 scripts/check_ci_warnings.py /tmp/seven-api-package.log
          nohup java -Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m \
            -jar backend/target/seven-chat-api-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=test \
            > /tmp/seven-api-local.log 2>&1 < /dev/null &
          echo $! > /tmp/seven-api-local.pid
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "Local API + PostgreSQL healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Local API failed to become healthy"
          tail -n 100 /tmp/seven-api-local.log
          exit 1

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Initialize Android emulator update metadata
        run: |
          install -d "$HOME/.android"
          printf 'lastUpdateCheck=0\n' > "$HOME/.android/emu-update-last-check.ini"

      - name: Enable hardware accelerated emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::KVM unavailable; emulator E2E cannot be certified."
            exit 1
          fi

      - name: Real-device-equivalent emulator integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            if ! curl -fsS --max-time 4 http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "::error::Local API stopped before Android tests; last server logs:"
              tail -n 80 /tmp/seven-api-local.log
              exit 1
            fi
            bash -euo pipefail -c 'gradle --no-daemon --warning-mode all connectedDebugAndroidTest 2>&1 | tee /tmp/seven-android-e2e.log'
            python3 scripts/check_ci_warnings.py /tmp/seven-android-e2e.log

      - name: Audit real API startup logs for warnings
        if: success()
        run: python3 scripts/check_ci_warnings.py /tmp/seven-api-local.log

      - name: Preserve Android and server evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seven-chat-android-real-api-e2e
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            /tmp/seven-api-local.log
            /tmp/seven-api-package.log
          if-no-files-found: error

# This workflow is NOT an approval for all features, voice rooms, livestreams
# and VIP purchases. release-certification.json must remain fail-closed.
