name: Android Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web dependencies
        working-directory: .
        run: npm install

      - name: Run web unit tests
        working-directory: .
        run: npm test

      - name: Run web typecheck
        working-directory: .
        run: npm run typecheck

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        run: npm install

      - name: Run mobile typecheck
        run: npm run typecheck

      - name: Generate branded launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SEVEN_API_URL: https://seven-chat-gwt1.vercel.app
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable APK
        env:
          EXPO_PUBLIC_SEVEN_API_URL: https://seven-chat-gwt1.vercel.app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../../Seven-Chat-1.0.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Seven-Chat-1.0.2-APK
          path: Seven-Chat-1.0.2.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.2"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Seven Chat 1.0.2" --notes "Seven Chat 1.0.2 — correções de cadastro, compatibilidade de banco e tratamento robusto da API mobile."
          gh release upload "$TAG" Seven-Chat-1.0.2.apk --clobber
