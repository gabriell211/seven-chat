name: Android Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate branded launcher icon\n        run: |\n          sudo apt-get update -qq\n          sudo apt-get install -y librsvg2-bin\n          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png\n      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SEVEN_API_URL: https://seven-chat-gwt1.vercel.app
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable APK
        env:
          EXPO_PUBLIC_SEVEN_API_URL: https://seven-chat-gwt1.vercel.app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../../Seven-Chat-1.0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Seven-Chat-1.0.1-APK
          path: Seven-Chat-1.0.1.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Seven Chat 1.0.1" --notes "Seven Chat 1.0.1 — Android APK."
          gh release upload "$TAG" Seven-Chat-1.0.1.apk --clobber
